<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Player</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<script>
// Host this file on HTTPS next to the app. Usage: player.html?v=VIDEO_ID&a=1
const p = new URLSearchParams(location.search);
const v = p.get('v') || '';
if (/^[\w-]{11}$/.test(v)) {
  const f = document.createElement('iframe');
  f.src = 'https://www.youtube.com/embed/' + v + '?rel=0&playsinline=1' + (p.get('a') === '1' ? '&autoplay=1' : '');
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.allowFullscreen = true;
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  document.body.appendChild(f);
}
</script>
</body>
</html>
